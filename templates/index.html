<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CHUNITHM 分表识别</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --card:#151d32; --line:#2b3858; --accent:#62e6c7; }
    * { box-sizing:border-box }
    body { margin:0; font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif; background:linear-gradient(145deg,#08101d,#141029); color:#eef3ff }
    main { width:min(1080px,calc(100% - 28px)); margin:36px auto 80px }
    h1 { margin:0 0 6px; font-size:clamp(25px,4vw,38px) }
    .sub { color:#aab6cf; margin:0 0 22px }
    .toolbar,.item { background:rgba(21,29,50,.92); border:1px solid var(--line); border-radius:15px }
    .toolbar { padding:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    input[type=file] { flex:1; min-width:220px }
    select,button { border:1px solid #46577c; border-radius:10px; padding:9px 13px; background:#202c48; color:#fff; cursor:pointer }
    button.primary { background:var(--accent); color:#061713; border-color:transparent; font-weight:750 }
    button:disabled { opacity:.55; cursor:wait }
    #status { min-height:24px; margin:16px 2px; color:#b8c3d9 }
    #results { display:grid; gap:12px }
    .item { padding:12px; display:grid; grid-template-columns:150px 1fr auto; gap:13px; align-items:center }
    .item img { width:150px; border-radius:9px; display:block }
    .command { width:100%; color:#eafcff; background:#0b1222; border:1px solid #293653; border-radius:9px; padding:10px; font:14px/1.3 ui-monospace,Consolas,monospace }
    .fields { display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:8px; margin-top:8px }
    .fields input,.fields select { width:100%; min-width:0; padding:7px 9px; color:#eef3ff; background:#202a43; border:1px solid #3a496a; border-radius:8px }
    .copy.done { background:#4bbf88; color:#06180f }
    @media(max-width:700px){ .item{grid-template-columns:92px 1fr}.item img{width:92px}.copy{grid-column:1/-1}.fields{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <h1>CHUNITHM 分表识别</h1>
  <p class="sub">按从左到右、从上到下的顺序识别；结果可直接修正，命令和复制内容会同步更新。</p>
  <form class="toolbar" id="form">
    <input id="image" name="image" type="file" accept="image/*" required>
    <label>版式
      <select id="layout" name="layout">
        <option value="auto" selected>自动检测</option>
        <option value="tippy">旧版 Tippy Bot</option>
        <option value="mate">新版 CHUNITHM MATE</option>
      </select>
    </label>
    <label>读取
      <select id="expected" name="expected">
        <option value="0" selected>全部</option>
        <option value="45">45 首</option>
        <option value="50">50 首</option>
      </select>
    </label>
    <button class="primary" id="start" type="submit">开始识别</button>
  </form>
  <div id="status"></div>
  <section id="results"></section>
</main>
<script>
const form = document.querySelector("#form");
const results = document.querySelector("#results");
const status = document.querySelector("#status");
const start = document.querySelector("#start");

function command(item) {
  return `upsert ${item.score.trim()} ${item.name.trim()} ${item.difficulty}`;
}
function renderItem(item) {
  const el = document.createElement("article");
  el.className = "item";
  el.innerHTML = `
    <img src="${item.preview}" alt="第 ${item.index} 个卡片">
    <div>
      <input class="command" value="" aria-label="upsert 命令" readonly>
      <div class="fields">
        <input class="score" value="${item.score}" placeholder="分数" inputmode="numeric">
        <input class="name" value="${item.name.replaceAll('"','&quot;')}" placeholder="歌名">
        <select class="difficulty">
          ${["Master","Ultima","Expert","Advanced","Basic"].map(x=>`<option ${x===item.difficulty?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>
    </div>
    <button class="copy" type="button">复制</button>`;
  const sync = () => {
    item.score = el.querySelector(".score").value;
    item.name = el.querySelector(".name").value;
    item.difficulty = el.querySelector(".difficulty").value;
    el.querySelector(".command").value = command(item);
  };
  el.querySelectorAll(".score,.name,.difficulty").forEach(x => x.addEventListener("input", sync));
  el.querySelector(".copy").addEventListener("click", async e => {
    await navigator.clipboard.writeText(command(item));
    e.currentTarget.textContent = "已复制";
    e.currentTarget.classList.add("done");
    setTimeout(()=>{ e.currentTarget.textContent="复制"; e.currentTarget.classList.remove("done") },1200);
  });
  sync();
  return el;
}
form.addEventListener("submit", async e => {
  e.preventDefault();
  results.replaceChildren();
  start.disabled = true;
  status.textContent = "正在定位卡片并逐个识别，首次启动模型可能需要 1–3 分钟…";
  try {
    const response = await fetch("/api/recognize", { method:"POST", body:new FormData(form) });
    const body = await response.text();
    let data;
    try { data = JSON.parse(body); }
    catch (_) {
      throw new Error(response.status === 502 || response.status === 503
        ? "云端识别服务暂时重启或超时，请等待一分钟后重试。"
        : `服务器没有返回完整结果（HTTP ${response.status}），请稍后重试。`);
    }
    if (!response.ok) throw new Error(data.error || "识别失败");
    data.items.forEach(item => results.append(renderItem(item)));
    const layoutLabel = data.layout === "mate" ? "CHUNITHM MATE 新 UI" : "Tippy Bot 旧 UI";
    status.textContent = `已按 ${layoutLabel} 识别 ${data.count} 个元素。请对照左侧卡片快速校对后复制。`;
  } catch (err) {
    status.textContent = err.message;
  } finally {
    start.disabled = false;
  }
});
</script>
</body>
</html>
